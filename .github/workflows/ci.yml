name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Agent (Python) sintaksisi
        run: python3 -m py_compile agent/ivms_agent.py
      - name: Agent (Python) testlari
        run: python3 -m unittest discover -s agent -p "test_*.py"
